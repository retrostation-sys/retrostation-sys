	<style>
		:root {
			--primary: #2563eb;
			--bg-dark: #0a0a0c;
			--card-bg: rgba(20, 20, 25, 0.95);
		}
		body {
			font-family: 'Inter', sans-serif;
			background-color: var(--bg-dark);
			color: #f8fafc;
			margin: 0;
			padding: 0;
			padding-bottom: 280px;
			scroll-behavior: smooth;
			overflow-x: hidden;
			min-height: 100vh;
		}
		.glass {
			background: var(--card-bg);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border: 1px solid rgba(255, 255, 255, 0.08);
		}
		.sticky-header {
			position: sticky;
			top: 0;
			z-index: 100;
			background-color: var(--bg-dark);
			padding-bottom: 4px;
		}
		.video-container {
			position: relative;
			padding-bottom: 56.25%;
			background: #000;
			border-bottom: 2px solid rgba(37, 99, 235, 0.3);
		}
		.controls-bar {
			height: 44px;
			margin-top: -1px;
			border-top: none;
			border-radius: 0 0 12px 12px;
		}
		@keyframes pulse-yellow {
			0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); transform: scale(1); }
			50% { box-shadow: 0 0 0 12px rgba(234, 179, 8, 0); transform: scale(1.05); }
			100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); transform: scale(1); }
		}
		.btn-playing {
			animation: pulse-yellow 1.5s infinite !important;
			background-color: #eab308 !important;
			color: black !important;
		}
		.main-content {
			padding: 12px 12px 20px 12px;
		}
		.skeleton {
			background: linear-gradient(90deg, #1f2937 25%, #374151 50%, #1f2937 75%);
			background-size: 200% 100%;
			animation: loading 1.5s infinite;
		}
		@keyframes loading {
			0% { background-position: 200% 0; }
			100% { background-position: -200% 0; }
		}
		.carousel-wrapper {
			display: flex;
			overflow-x: auto;
			scroll-snap-type: proximity;
			gap: 12px;
			padding: 8px 0;
			scrollbar-width: none;
		}
		.carousel-wrapper::-webkit-scrollbar {
		display: none; 
		}
		.carousel-item {
			flex: 0 0 45%;
			width: 45%;
			scroll-snap-align: center;
		}
		@media (min-width: 640px) {
			.carousel-item { flex: 0 0 35%; width: 35%; }
		}
		.modal-overlay {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 2000;
			background: rgba(0, 0, 0, 0.92);
			backdrop-filter: blur(12px);
		}
		.modal-overlay.active { display: flex; }
		#modal-search-input::placeholder {
			color: rgba(255, 255, 255, 0.4);
			text-transform: uppercase;
			font-weight: 800;
			letter-spacing: 0.05em;
		}
		#native-video-player {
			width: 100%;
			height: 100%;
			position: absolute;
			top: 0; left: 0;
			display: none;
			background: #000;
		}
		#pub {
			position: fixed;
			bottom: 0;
			left: 0;
			width: 100%;
			background: rgba(10, 10, 12, 0.98);
			border-top: 1px solid rgba(255, 255, 255, 0.1);
			z-index: 999;
			padding: 10px 0;
			text-align: center;
		}
	</style>
</head>

	<script>
    $(document).ready(function() {
        $(document).on('click', function() {
            const docElm = document.documentElement;
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (docElm.requestFullscreen) docElm.requestFullscreen().catch(e => {});
            }
        });
    });

    var player;
    var isPlayerReady = false;
    var firstVideoId = '';
    const nativePlayer = document.getElementById('native-video-player');
    const ytIframe = document.getElementById('youtube-player');
    const shareBtn = document.getElementById('share-iptv-btn');
    let hls = null;
    let currentItemUrl = "";

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
            height: '100%',
            width: '100%',
            videoId: firstVideoId,
            playerVars: { 'autoplay': 0, 'rel': 0, 'enablejsapi': 1, 'origin': window.location.origin },
            events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
        });
    }

    function onPlayerReady(event) { isPlayerReady = true; }

    function onPlayerStateChange(event) {
        const btn = document.getElementById('action-button');
        const btnText = document.getElementById('btn-text');
        if (event.data == YT.PlayerState.PLAYING) {
            btn.classList.add('btn-playing');
            btnText.innerText = "DESCARGALA COMPLETA AQUI POR TERABOX";
        } else {
            btn.classList.remove('btn-playing');
            btnText.innerText = "TERABOX";
        }
    }

    function toggleFullScreen() {
        const docEl = document.documentElement;
        if (!document.fullscreenElement) { if (docEl.requestFullscreen) docEl.requestFullscreen(); } 
        else { if (document.exitFullscreen) document.exitFullscreen(); }
    }

    function isDirectLink(url) {
        if (!url) return false;
        const low = url.toLowerCase();
        return low.includes('.m3u8') || low.includes('.mp4') || low.includes('.m3u') || (low.startsWith('http') && !low.includes('youtube.com'));
    }

    function selectMedia(item) {
        const selectedId = getRandomValue(item.youtubeId);
        const actionBtn = document.getElementById('action-button');
        
        currentItemUrl = selectedId;
        const isIPTV = item.buscar && item.buscar.includes('IPTV');
        
        if (isIPTV) {
            window.open(selectedId, '_blank');
            closeNewsModal(); closeSearchModal();
            return;
        }
        
        if (selectedId.includes('.m3u8')) { shareBtn.classList.remove('hidden'); } 
        else { shareBtn.classList.add('hidden'); }

        const hideTerabox = (item.buscar && item.buscar.includes('YOUTUBE')) || isDirectLink(selectedId);
        actionBtn.style.display = hideTerabox ? 'none' : 'flex';

        if (isDirectLink(selectedId)) {
            ytIframe.style.display = 'none';
            nativePlayer.style.display = 'block';
            if (player && player.pauseVideo) player.pauseVideo();
            if (selectedId.toLowerCase().includes('.m3u8') || selectedId.toLowerCase().includes('.m3u')) {
                if (Hls.isSupported()) {
                    if (hls) hls.destroy();
                    hls = new Hls();
                    hls.loadSource(selectedId);
                    hls.attachMedia(nativePlayer);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => { nativePlayer.play().catch(() => {}); });
                } else if (nativePlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    nativePlayer.src = selectedId;
                    nativePlayer.play().catch(() => {});
                }
            } else {
                if (hls) { hls.destroy(); hls = null; }
                nativePlayer.src = selectedId;
                nativePlayer.load();
                nativePlayer.play().catch(() => {});
            }
        } else {
            nativePlayer.style.display = 'none';
            ytIframe.style.display = 'block';
            if (nativePlayer.pause) nativePlayer.pause();
            if (hls) { hls.destroy(); hls = null; }
            if (isPlayerReady && player && player.loadVideoById) { player.loadVideoById({ 'videoId': selectedId }); } 
            else { firstVideoId = selectedId; }
        }

        currentUrl = item.buttonId ? `https://1024terabox.com/s/${item.buttonId}` : 'https://www.terabox.com/';
        localStorage.setItem('lastViewed', JSON.stringify(item));
        closeNewsModal(); closeSearchModal();
    }

    function openShareModal() {
        document.getElementById('share-url-input').value = currentItemUrl;
        document.getElementById('share-modal').classList.add('active');
        document.getElementById('copy-success').classList.add('hidden');
    }
    function closeShareModal() { document.getElementById('share-modal').classList.remove('active'); }
    function copyShareUrl() {
        const input = document.getElementById('share-url-input');
        input.select();
        document.execCommand('copy');
        document.getElementById('copy-success').classList.remove('hidden');
    }
    function getRandomValue(val) {
        if (Array.isArray(val)) return val[Math.floor(Math.random() * val.length)];
        return val;
    }

    const allData = {
    	'pelíc': {
    		title: '<center><p style="background-color:blue; color:white">LINKS DE DESCARGA POR TERABOX</p></center>', 
    		carousels: [
    			...(typeof data_peliculas1 !== 'undefined' ? data_peliculas1 : []),
    			...(typeof data_peliculasA !== 'undefined' ? data_peliculasA : []),
    			...(typeof data_peliculasB !== 'undefined' ? data_peliculasB : []),
    			...(typeof data_peliculasC !== 'undefined' ? data_peliculasC : []),
    			...(typeof data_peliculasD !== 'undefined' ? data_peliculasD : []),
    			...(typeof data_peliculasE !== 'undefined' ? data_peliculasE : []),
    			...(typeof data_peliculasF !== 'undefined' ? data_peliculasF : []),
    			...(typeof data_peliculasG !== 'undefined' ? data_peliculasG : []),
    			...(typeof data_peliculasH !== 'undefined' ? data_peliculasH : []),
    			...(typeof data_peliculasI !== 'undefined' ? data_peliculasI : []),
    			...(typeof data_peliculasJ !== 'undefined' ? data_peliculasJ : []),
    			...(typeof data_peliculasK !== 'undefined' ? data_peliculasK : []),
    			...(typeof data_peliculasL !== 'undefined' ? data_peliculasL : []),
    			...(typeof data_peliculasM !== 'undefined' ? data_peliculasM : []),
    			...(typeof data_peliculasN !== 'undefined' ? data_peliculasN : []),
    			...(typeof data_peliculasO !== 'undefined' ? data_peliculasO : []),
    			...(typeof data_peliculasP !== 'undefined' ? data_peliculasP : []),
    			...(typeof data_peliculasQ !== 'undefined' ? data_peliculasQ : []),
    			...(typeof data_peliculasR !== 'undefined' ? data_peliculasR : []),
    			...(typeof data_peliculasS !== 'undefined' ? data_peliculasS : []),
    			...(typeof data_peliculasT !== 'undefined' ? data_peliculasT : []),
    			...(typeof data_peliculasU !== 'undefined' ? data_peliculasU : []),
    			...(typeof data_peliculasV !== 'undefined' ? data_peliculasV : []),
    			...(typeof data_peliculasW !== 'undefined' ? data_peliculasW : []),
    			...(typeof data_peliculasX !== 'undefined' ? data_peliculasX : []),
    			...(typeof data_peliculasY !== 'undefined' ? data_peliculasY : []),
    			...(typeof data_peliculasZ !== 'undefined' ? data_peliculasZ : [])
    		]
    	},
		'estrenos': {
			title: '<center><p style="background-color:blue; color:white;">LO MAS RECIENTE</p></center>', 
			carousels: (typeof data_estrenos !== 'undefined' ? data_estrenos : [])
		},
		'ytub': {
			title: '<center><p style="background-color:blue; color:white;">VIDEOS YOUTUBE</p></center>', 
			carousels: (typeof data_youtube !== 'undefined' ? data_youtube : [])
		},
		'canalesTv': {
           title: '<center><p style="background-color:blue; color:white;">CANALES TV (IPTV)</p></center>', 
           carousels: (typeof data_canalesTv !== 'undefined' ? data_canalesTv : [])
        },
		'películasTv': {
           title: '<center><p style="background-color:blue; color:white;">PELICULAS (IPTV)</p></center>', 
           carousels: (typeof data_peliculasTv !== 'undefined' ? data_peliculasTv : [])
        }
	};

        const allImages = Object.values(allData).flatMap(c => c.carousels.flatMap(car => car.data));
        const actionButton = document.getElementById('action-button');
        const searchInput = document.getElementById('image-search-input');
        const modalSearchInput = document.getElementById('modal-search-input');
        let currentUrl = 'https://www.terabox.com/';

        function cleanText(text) {
            if (!text) return "";
            return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "").trim();
        }

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            modalSearchInput.value = val;
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => filterData(val), 400);
        });

        modalSearchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            searchInput.value = val;
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => filterData(val), 400);
        });

        function filterData(query) {
            const q = cleanText(query);
            const searchModal = document.getElementById('search-modal');
            const resultsGrid = document.getElementById('search-results-grid');
            const emptyMsg = document.getElementById('search-empty');
            
            if (q.length > 0) {
                const results = allImages.filter(i => 
                    cleanText(i.title).includes(q) || cleanText(i.buscar).includes(q) || cleanText(i.subtitle).includes(q)
                );
                searchModal.classList.add('active');
                resultsGrid.innerHTML = '';
                if (results.length > 0) {
                    emptyMsg.classList.add('hidden');
                    results.forEach(item => {
                        const thumbId = getRandomValue(item.id);
                        const div = document.createElement('div');
                        div.className = 'cursor-pointer group flex flex-col gap-1.5';
                        div.onclick = () => selectMedia(item);
                        div.innerHTML = `<div class="relative overflow-hidden rounded-xl bg-gray-900 border border-white/5 aspect-video"><img src="https://drive.google.com/thumbnail?id=${thumbId}" class="w-full h-full object-cover transition-transform group-hover:scale-105"/></div><div class="min-w-0"><h4 class="text-[9px] font-bold text-gray-100 truncate uppercase leading-tight">${item.title}</h4><p class="text-[8px] text-gray-400 truncate mt-0.5">${item.subtitle}</p><p class="text-[7px] text-gray-500 truncate">${item.subtitle2 || ''}</p></div>`;
                        resultsGrid.appendChild(div);
                    });
                } else { emptyMsg.classList.remove('hidden'); }
            } else { closeSearchModal(); }
        }

        function closeSearchModal() { 
            document.getElementById('search-modal').classList.remove('active');
            searchInput.value = ''; modalSearchInput.value = '';
        }

        function renderCarousel(container, data) {
            container.innerHTML = '';
            data.forEach(item => {
                const thumbId = getRandomValue(item.id);
                const div = document.createElement('div');
                div.className = 'carousel-item group cursor-pointer';
                div.onclick = () => selectMedia(item);
                div.innerHTML = `
                    <div class="relative overflow-hidden rounded-xl bg-gray-900 border border-white/5 aspect-video">
                        <div class="skeleton absolute inset-0"></div>
                        <img src="https://drive.google.com/thumbnail?id=${thumbId}" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-500" onload="this.style.opacity='1'; this.previousElementSibling.style.display='none'"/>
                    </div>
                    <div class="mt-1.5 px-0.5 min-w-0">
                        <h4 class="text-[10px] font-bold text-gray-100 truncate uppercase leading-tight">${item.title}</h4>
                        <p class="text-[9px] text-gray-400 truncate mt-0.5">${item.subtitle}</p>
                        <p class="text-[8px] text-gray-500 truncate">${item.subtitle2 || ''}</p>
                    </div>`;
                container.appendChild(div);
            });
        }

        function showNews() {
            if(!allData.estrenos) return;
            const estrenos = allData.estrenos.carousels[0].data;
            const list = document.getElementById('news-list');
            list.innerHTML = '';
            estrenos.forEach(item => {
                const thumbId = getRandomValue(item.id);
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 bg-white/5 p-2 rounded-xl border border-white/5 cursor-pointer hover:bg-white/10 transition";
                div.onclick = () => selectMedia(item);
                div.innerHTML = `<img src="https://drive.google.com/thumbnail?id=${thumbId}" class="w-12 h-8 object-cover rounded shadow" /><div class="flex-1 min-w-0"><p class="text-white text-[10px] font-black truncate uppercase">${item.title}</p><p class="text-gray-400 text-[8px] truncate">${item.subtitle}</p></div>`;
                list.appendChild(div);
            });
            document.getElementById('news-modal').classList.add('active');
        }

        function closeNewsModal() { document.getElementById('news-modal').classList.remove('active'); }

        document.addEventListener('DOMContentLoaded', () => {
            const section = document.getElementById('original-carousels-section');
            Object.entries(allData).forEach(([key, cat]) => {
                // ✅ ESTRRENOS NO SE MUESTRA EN LA PÁGINA, SOLO EN EL MODAL DE LA ESTRELLA
                if (key === 'estrenos' || !cat || !cat.carousels) return;
                
                const div = document.createElement('div');
                div.className = 'mb-5';
                div.innerHTML = `<h2 class="text-xs font-black mb-1.5 px-2 text-gray-400 border-l-2 border-blue-600 ml-1 uppercase tracking-tight"> ${cat.title}</h2>`;
                cat.carousels.forEach(c => {
                    if (!c || !c.data) return;
                    const wrap = document.createElement('div');
                    wrap.className = 'carousel-wrapper';
                    renderCarousel(wrap, c.data);
                    div.appendChild(wrap);
                });
                section.appendChild(div);
            });
            
            const saved = localStorage.getItem('lastViewed');
            if (saved) {
                const item = JSON.parse(saved);
                if (!(item.buscar && item.buscar.includes('IPTV'))) { selectMedia(item); }
            } else if (allImages.length > 0) {
                if (!(allImages[0].buscar && allImages[0].buscar.includes('IPTV'))) { selectMedia(allImages[0]); }
            }
        });

        actionButton.onclick = () => window.open(currentUrl, '_blank');
    </script>
